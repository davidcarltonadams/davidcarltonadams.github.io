<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="hold a just-intoned drone, add partials, and detune a twin oscillator up to eight cents to hear and see beats at the difference frequency">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <title>drone — David Carlton Adams</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    .eggs-back {
      position: fixed; top: .7rem; left: 1rem;
      font-size: .58rem; color: var(--control); text-decoration: none;
      letter-spacing: .08em; font-family: 'SF Mono','Fira Code',monospace;
      z-index: 100; transition: color .15s;
    }
    .eggs-back:hover { color: #aaa; }

    :root {
      --bg:      #060606;
      --bg2:     #0d0d0d;
      --text:    #d4ccc4;
      --dim:     rgba(212,204,196,0.55);
      --dimmer:  rgba(212,204,196,0.35);
      --accent:  rgba(212,204,196,0.8);
      --on-bg:   rgba(212,204,196,0.10);
      --border:  rgba(212,204,196,0.18);
      --control: rgba(212,204,196,0.58);   /* anything clickable: 4.6:1 on --bg */
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 2rem 1.5rem 3rem;
    }

    /* ── Title + epigraph ───────────────────────────────────── */
    .header { text-align: center; max-width: 30rem; }
    .title {
      font-size: 0.95rem; font-weight: normal;
      letter-spacing: 0.24em; text-transform: lowercase; color: var(--text);
    }
    .sub {
      font-size: 0.6rem; letter-spacing: 0.08em; line-height: 1.7;
      color: var(--dim); font-style: italic; margin-top: 0.4rem;
    }
    #ji-line {
      font-size: 0.6rem; letter-spacing: 0.12em;
      color: var(--dim); margin-top: 0.3rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    /* ── Pitch display ──────────────────────────────────────── */
    #freq-display {
      text-align: center;
      cursor: pointer;
    }

    #note-name {
      font-size: clamp(3rem, 12vw, 6rem);
      font-weight: normal;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1;
      transition: color 0.3s;
    }
    #note-name.playing { color: #d4ccc4; }

    #freq-hz {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: var(--dim);
      margin-top: 0.4rem;
      font-style: italic;
    }

    /* ── Beat visualizer ────────────────────────────────────── */
    #beat-canvas {
      width: min(360px, 88vw);
      height: 40px;
      opacity: 0.4;
      transition: opacity 0.5s;
    }
    #beat-canvas.active { opacity: 1; }

    /* ── Controls ───────────────────────────────────────────── */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.6rem;
      width: min(360px, 88vw);
    }

    .ctrl-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 100%;
    }

    .ctrl-label {
      font-size: 0.55rem;
      letter-spacing: 0.18em;
      color: var(--dimmer);
      text-transform: uppercase;
      width: 4.5rem;
      flex-shrink: 0;
      font-style: italic;
    }

    .ctrl-value {
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      color: var(--dim);
      width: 4rem;
      text-align: right;
      flex-shrink: 0;
    }

    input[type=range] {
      flex: 1;
      -webkit-appearance: none;
      height: 1px;
      background: var(--border);
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--dim);
      cursor: pointer;
      transition: background 0.2s;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      background: var(--accent);
    }
    input[type=range]:focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: 5px;
    }
    input[type=range]:focus-visible::-webkit-slider-thumb {
      background: var(--accent);
    }

    /* ── Pitch wheel ────────────────────────────────────────── */
    #pitch-wheel {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .note-btn {
      font-size: 0.55rem;
      letter-spacing: 0.06em;
      color: var(--control);
      background: none;
      border: 1px solid transparent;
      padding: 0.3rem 0.45rem;
      cursor: pointer;
      font-family: Georgia, serif;
      border-radius: 2px;
      transition: all 0.15s;
    }
    .note-btn:hover { color: var(--accent); border-color: var(--border); }
    .note-btn.selected {
      color: var(--text);
      border-color: var(--dim);
      background: var(--on-bg);
    }

    /* ── Partial toggles ────────────────────────────────────── */
    #partial-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .partial-btn {
      font-size: 0.55rem;
      letter-spacing: 0.08em;
      color: var(--control);
      background: none;
      border: 1px solid var(--border);
      padding: 0.3rem 0.5rem;
      cursor: pointer;
      font-family: 'SF Mono', 'Fira Code', monospace;
      border-radius: 2px;
      transition: all 0.15s;
      min-width: 2rem;
      text-align: center;
    }
    .partial-btn:hover { color: var(--accent); }
    .partial-btn.on {
      color: var(--text);
      border-color: var(--dim);
      background: var(--on-bg);
    }

    /* ── On/Off ─────────────────────────────────────────────── */
    #toggle-btn {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--control);
      background: none;
      border: 1px solid var(--border);
      padding: 0.6rem 2rem;
      cursor: pointer;
      font-family: Georgia, serif;
      font-style: italic;
      border-radius: 2px;
      transition: all 0.2s;
    }
    #toggle-btn:hover { color: var(--accent); border-color: var(--dim); }
    #toggle-btn.playing {
      color: var(--text);
      border-color: rgba(212,204,196,0.4);
    }
  </style>
</head>
<body>

<a class="eggs-back" href="../eggs.html">← eggs</a>

<div class="header">
  <h1 class="title">drone</h1>
  <p class="sub">just intonation on C · C4 = 261.63 Hz, so A4 sounds at 436.05 Hz, 15.6¢ below A440 · beating detunes a twin up to 8¢</p>
</div>

<div id="freq-display">
  <div id="note-name">A</div>
  <div id="freq-hz">220.00 Hz · A3</div>
  <div id="ji-line">5/3 above C · 884.4¢ · −15.6¢ from 12-tet</div>
</div>

<canvas id="beat-canvas" width="720" height="80"></canvas>

<div class="controls">

  <!-- Pitch selection -->
  <div id="pitch-wheel"></div>

  <!-- Octave -->
  <div class="ctrl-row">
    <span class="ctrl-label">octave</span>
    <input type="range" id="octave-slider" min="1" max="5" step="1" value="3">
    <span class="ctrl-value" id="octave-val">3</span>
  </div>

  <!-- Beating -->
  <div class="ctrl-row">
    <span class="ctrl-label">beating</span>
    <input type="range" id="beat-slider" min="0" max="8" step="0.05" value="0">
    <span class="ctrl-value" id="beat-val">off</span>
  </div>

  <!-- Volume -->
  <div class="ctrl-row">
    <span class="ctrl-label">volume</span>
    <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.4">
    <span class="ctrl-value" id="vol-val">40%</span>
  </div>

  <!-- Partials -->
  <div class="ctrl-row">
    <span class="ctrl-label">partials</span>
    <div id="partial-row"></div>
  </div>

  <button id="toggle-btn">sound</button>

</div>

<script>
// ── Pitch data ─────────────────────────────────────────────────────────────
const NOTES = [
  { name: 'C',  ratio: 1/1,   frac: '1/1',  et: 0 },
  { name: 'D',  ratio: 9/8,   frac: '9/8',  et: 200 },
  { name: 'E',  ratio: 5/4,   frac: '5/4',  et: 400 },
  { name: 'F',  ratio: 4/3,   frac: '4/3',  et: 500 },
  { name: 'G',  ratio: 3/2,   frac: '3/2',  et: 700 },
  { name: 'A',  ratio: 5/3,   frac: '5/3',  et: 900 },
  { name: 'B',  ratio: 15/8,  frac: '15/8', et: 1100 },
];
// JI ratios relative to C4 = 261.63 Hz
const C4 = 261.63;

const PARTIALS = [2, 3, 4, 5, 6, 7, 8, 9, 11, 13, 16, 21];
const PARTIAL_LABELS = ['2', '3', '4', '5', '6', '7', '8', '9', '11', '13', '16', '21'];
const PARTIAL_NAMES  = ['octave', '5th', '2nd oct', 'M3', '5th', 'b7', '3rd oct', 'M2', '+4th', 'neutral 6th', '4th oct', '7th of 5th'];

let state = {
  noteIdx:   5,   // A
  octave:    3,
  beatCents: 0,
  volume:    0.4,
  partials:  new Set(),
  playing:   false,
};

function rootFreq() {
  const n = NOTES[state.noteIdx];
  // C in the chosen octave
  const cFreq = C4 * Math.pow(2, state.octave - 4);
  return cFreq * n.ratio;
}

function noteLabel() {
  return NOTES[state.noteIdx].name + state.octave;
}

// Frequency of the detuned twin, and the beat rate it produces against the root
function beatFreq() {
  return rootFreq() * Math.pow(2, state.beatCents / 1200);
}

function beatRateHz() {
  return state.beatCents > 0 ? Math.abs(beatFreq() - rootFreq()) : 0;
}

// ── Web Audio ──────────────────────────────────────────────────────────────
const FADE = 0.015; // fade in/out seconds — eliminates clicks
const BEAT_GAIN = 0.7;
let ctx, masterGain, oscNodes = [], beatNode = null;

// Headroom without a limiter (a compressor would flatten the very beats this
// egg is about). The partials start together at sine phase 0, so they stay
// phase-locked to the fundamental; the twin drifts through every phase. The
// true peak of the active set is therefore the max over one period and all
// twin phases, which a small grid finds. The master gain is capped so that
// peak lands under 0.9: nothing changes until the volume would clip (the
// fundamental + twin reach it above 52%), then the slider tops out there.
const PEAK_CEILING = 0.88;   // 0.9 target, less the grid's sampling error
let peakCache = { key: '', peak: 1 };
function activePeak() {
  const beat = state.beatCents > 0;
  const parts = [...state.partials].sort((a, b) => a - b);
  const key = (beat ? 'b' : '') + parts.join(',');
  if (key === peakCache.key) return peakCache.peak;
  let peak = 0;
  const NX = 720, NP = beat ? 48 : 1;
  for (let j = 0; j < NP; j++) {
    const phi = (j / NP) * 2 * Math.PI;
    for (let i = 0; i < NX; i++) {
      const x = (i / NX) * 2 * Math.PI;
      let v = Math.sin(x) + (beat ? BEAT_GAIN * Math.sin(x + phi) : 0);
      for (const p of parts) v += (0.5 / p) * Math.sin(p * x);
      peak = Math.max(peak, Math.abs(v));
    }
  }
  peakCache = { key, peak };
  return peak;
}
function masterLevel() { return Math.min(state.volume, PEAK_CEILING / activePeak()); }

// The cap holds in steady state; in a change the master leads. When the peak
// grows (twin in, a partial added) the master drops first and the new sound
// waits until it is down; when the peak shrinks the old sound leaves first and
// the master rises after. (Master and twin used to ramp together at the same
// time constant, and the product overshot: 1.03 as the beat left 0.) Returns
// when incoming sound may start. All times are linear ramps from t0.
const LEAD = 0.02;   // scheduling lookahead, so every node of a change starts on one sample
function moveMaster(t0) {
  const g = masterGain.gain, cur = g.value, target = masterLevel();
  g.cancelScheduledValues(t0);
  g.setValueAtTime(cur, t0);
  if (target < cur) { g.linearRampToValueAtTime(target, t0 + FADE); return t0 + FADE; }
  g.setValueAtTime(cur, t0 + FADE);
  g.linearRampToValueAtTime(target, t0 + 2 * FADE);
  return t0;
}

function startAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = ctx.createGain();
  masterGain.gain.value = masterLevel();
  masterGain.connect(ctx.destination);
}

function startDrone() {
  if (!ctx) startAudio();
  if (ctx.state === 'suspended') ctx.resume();
  const t0 = ctx.currentTime + LEAD;
  stopDrone(t0);
  const at = moveMaster(t0);

  const freq = rootFreq();

  // every oscillator starts at \`at\`: started "now", they could land in
  // different render quanta and lose the phase lock activePeak() assumes
  function makeOsc(f, gainVal) {
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = f;
    gain.gain.value = 0;
    gain.gain.setValueAtTime(0, at);
    gain.gain.linearRampToValueAtTime(gainVal, at + FADE);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(at);
    return { osc, gain };
  }

  // Fundamental
  oscNodes.push(makeOsc(freq, 1.0));

  // Detuned copy for beating — always built, silent at 0 cents, so the beat
  // slider can retune it in place instead of tearing the whole voice down
  beatNode = makeOsc(beatFreq(), state.beatCents > 0 ? BEAT_GAIN : 0);
  oscNodes.push(beatNode);

  // Active partials (scaled volume: 1/partial)
  for (const p of state.partials) {
    oscNodes.push(makeOsc(freq * p, 0.5 / p));
  }
}

function stopDrone(t0) {
  const now = t0 ?? (ctx ? ctx.currentTime : 0);
  oscNodes.forEach(({ osc, gain }) => {
    try {
      gain.gain.cancelScheduledValues(now);
      gain.gain.setValueAtTime(gain.gain.value, now);
      gain.gain.linearRampToValueAtTime(0, now + FADE);
      osc.stop(now + FADE + 0.001);
    } catch(e) {}
  });
  oscNodes = [];
  beatNode = null;
}

// Beat rate changes never rebuild the voice — the twin is retuned under the
// sustained tone, so the drone doesn't stutter as the slider moves.
function retuneBeat() {
  if (!ctx || !beatNode) return;
  const now = ctx.currentTime;
  beatNode.osc.frequency.setTargetAtTime(beatFreq(), now, 0.02);
  const g = beatNode.gain.gain, cur = g.value, want = state.beatCents > 0 ? BEAT_GAIN : 0;
  const at = moveMaster(now);   // the twin enters after the master drops, leaves before it rises
  g.cancelScheduledValues(now);
  g.setValueAtTime(cur, now);
  g.setValueAtTime(cur, at);
  g.linearRampToValueAtTime(want, at + FADE);
}

function restartIfPlaying() {
  if (state.playing) {
    stopDrone();
    startDrone();
    updateDisplay();
  }
}

// ── Beat canvas ────────────────────────────────────────────────────────────
const canvas = document.getElementById('beat-canvas');
const canvasCtx = canvas.getContext('2d');
let animFrame = null;

// Display carrier, in cycles per second of drawn time. The real drone runs
// hundreds of Hz — far too fast to draw — so the pair is transposed down
// wholesale and only the *difference* is kept true: the twin sits exactly
// beatHz above the carrier, so the drawn envelope beats at the rate the
// ears hear.
const DISPLAY_HZ = 40;

function beatSample(t, beatHz) {
  if (beatHz <= 0) return Math.sin(2 * Math.PI * DISPLAY_HZ * t);
  const a1 = Math.sin(2 * Math.PI * DISPLAY_HZ * t);
  const a2 = Math.sin(2 * Math.PI * (DISPLAY_HZ + beatHz) * t);
  return (a1 + a2) / 2;
}

function drawBeat(ts) {
  animFrame = requestAnimationFrame(drawBeat);
  const W = canvas.width, H = canvas.height;
  canvasCtx.clearRect(0, 0, W, H);

  if (!state.playing) return;

  const beatHz = beatRateHz();

  const now = ts / 1000;
  const midY = H / 2;
  canvasCtx.strokeStyle = 'rgba(212,204,196,0.5)';
  canvasCtx.lineWidth = 1.5;
  canvasCtx.beginPath();

  for (let x = 0; x < W; x++) {
    const t = now + (x / W) * 0.5; // 0.5 second window, scrolling
    const y = midY - beatSample(t, beatHz) * midY * 0.6;
    x === 0 ? canvasCtx.moveTo(x, y) : canvasCtx.lineTo(x, y);
  }
  canvasCtx.stroke();
}
animFrame = requestAnimationFrame(drawBeat);

// ── UI ─────────────────────────────────────────────────────────────────────
const noteNameEl  = document.getElementById('note-name');
const freqHzEl    = document.getElementById('freq-hz');
const jiLineEl    = document.getElementById('ji-line');
const pitchWheel  = document.getElementById('pitch-wheel');
const octaveSlider = document.getElementById('octave-slider');
const octaveVal    = document.getElementById('octave-val');
const beatSlider   = document.getElementById('beat-slider');
const beatVal      = document.getElementById('beat-val');
const volSlider    = document.getElementById('vol-slider');
const volVal       = document.getElementById('vol-val');
const partialRow   = document.getElementById('partial-row');
const toggleBtn    = document.getElementById('toggle-btn');

function updateDisplay() {
  const f  = rootFreq();
  const nl = noteLabel();
  noteNameEl.textContent = NOTES[state.noteIdx].name;
  freqHzEl.textContent   = f.toFixed(2) + ' Hz · ' + nl;
  // the ratio above C, and how far that sits from the 12-tet note of that name
  const n = NOTES[state.noteIdx];
  const cents = 1200 * Math.log2(n.ratio), dev = cents - n.et;
  jiLineEl.textContent = n.frac + ' above C · ' + cents.toFixed(1) + '¢ · '
    + (dev < 0 ? '−' : '+') + Math.abs(dev).toFixed(1) + '¢ from 12-tet';

  // pitch buttons
  pitchWheel.querySelectorAll('.note-btn').forEach((b, i) => {
    b.classList.toggle('selected', i === state.noteIdx);
  });

  // beat label
  if (state.beatCents === 0) {
    beatVal.textContent = 'off';
  } else {
    beatVal.textContent = beatRateHz().toFixed(2) + ' Hz';
  }
}

// Build pitch buttons
NOTES.forEach((n, i) => {
  const btn = document.createElement('button');
  btn.className = 'note-btn' + (i === state.noteIdx ? ' selected' : '');
  btn.textContent = n.name;
  btn.title = n.name + ' (' + n.frac + ' above C)';
  btn.addEventListener('click', () => {
    state.noteIdx = i;
    restartIfPlaying();
    updateDisplay();
  });
  pitchWheel.appendChild(btn);
});

// Build partial toggles
PARTIALS.forEach((p, i) => {
  const btn = document.createElement('button');
  btn.className = 'partial-btn';
  btn.textContent = PARTIAL_LABELS[i];
  btn.title = 'partial ' + p + ' (' + PARTIAL_NAMES[i] + ')';
  btn.addEventListener('click', () => {
    if (state.partials.has(p)) state.partials.delete(p);
    else state.partials.add(p);
    btn.classList.toggle('on', state.partials.has(p));
    restartIfPlaying();
  });
  partialRow.appendChild(btn);
});

// Octave
octaveSlider.addEventListener('input', () => {
  state.octave = parseInt(octaveSlider.value, 10);
  octaveVal.textContent = state.octave;
  restartIfPlaying();
  updateDisplay();
});

// Beating — retune only, no rebuild
function setBeatCents(cents) {
  state.beatCents = cents;
  retuneBeat();
  updateDisplay();
}

beatSlider.addEventListener('input', () => {
  setBeatCents(parseFloat(beatSlider.value));
});

// Volume
volSlider.addEventListener('input', () => {
  state.volume = parseFloat(volSlider.value);
  volVal.textContent = Math.round(state.volume * 100) + '%';
  if (masterGain) moveMaster(ctx.currentTime);   // one scheduler for the master, so a change mid-transition is not lost
});

// Toggle
toggleBtn.addEventListener('click', () => {
  state.playing = !state.playing;
  if (state.playing) {
    startDrone();
    toggleBtn.textContent = 'silence';
    toggleBtn.classList.add('playing');
    noteNameEl.classList.add('playing');
    canvas.classList.add('active');
  } else {
    stopDrone();
    toggleBtn.textContent = 'sound';
    toggleBtn.classList.remove('playing');
    noteNameEl.classList.remove('playing');
    canvas.classList.remove('active');
  }
});

// Keyboard shortcuts: note names, octave ±, space = toggle
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  // leave browser/OS shortcuts alone
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  // letter keys mapped to CDEFGAB
  const map = { c:0, d:1, e:2, f:3, g:4, a:5, b:6 };
  const k = e.key.toLowerCase();
  if (map[k] !== undefined) {
    state.noteIdx = map[k];
    restartIfPlaying(); updateDisplay();
  } else if (e.key === 'ArrowUp') {
    state.octave = Math.min(5, state.octave + 1);
    octaveSlider.value = state.octave; octaveVal.textContent = state.octave;
    restartIfPlaying(); updateDisplay();
  } else if (e.key === 'ArrowDown') {
    state.octave = Math.max(1, state.octave - 1);
    octaveSlider.value = state.octave; octaveVal.textContent = state.octave;
    restartIfPlaying(); updateDisplay();
  } else if (e.key === ' ') {
    e.preventDefault();
    toggleBtn.click();
  }
});

updateDisplay();
</script>
</body>
</html>
