<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="play 12-, 19- and 31-tet, just intonation and the harmonic series on one keyboard, each key labelled with its cents deviation from 12-tet">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16.png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <title>tuning systems — david carlton adams</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #080808;
      --bg2:    #111111;
      --text:   #d8d0c8;
      --dim:    rgba(216,208,200,0.4);
      --dimmer: rgba(216,208,200,0.18);
      --control: rgba(216,208,200,0.58);   /* ≥4.5:1 on --bg: anything clickable */
      --accent: #8ab0c8;
      --accent-bg: rgba(138,176,200,0.14);
      --border: rgba(255,255,255,0.07);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.5rem 3.5rem;
      gap: 1.4rem;
    }

    /* ── Header ──────────────────────────────────────── */
    .header { text-align: center; }

    .title {
      font-size: clamp(0.85rem, 2.2vw, 1.1rem);
      font-weight: normal;
      letter-spacing: 0.2em;
      text-transform: lowercase;
    }

    .sub {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      color: var(--dim);
      font-style: italic;
      margin-top: 0.3rem;
    }

    /* ── Control rows ─────────────────────────────────── */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem 1.5rem;
      align-items: center;
      justify-content: center;
    }

    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .ctrl-label {
      font-size: 0.58rem;
      letter-spacing: 0.13em;
      font-style: italic;
      color: var(--dim);
      text-transform: lowercase;
    }

    .btn-row { display: flex; gap: 0.22rem; }

    .tog {
      background: none;
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--control);
      font-family: Georgia, serif;
      font-size: 0.63rem;
      letter-spacing: 0.07em;
      padding: 0.28rem 0.6rem;
      cursor: pointer;
      transition: color 0.1s, border-color 0.1s, background 0.1s;
    }
    .tog:hover { color: var(--text); border-color: rgba(255,255,255,0.18); }
    .tog.on { color: var(--accent); border-color: var(--accent); background: var(--accent-bg); }
    .oct-btn.on { color: var(--accent); border-color: var(--accent); background: var(--accent-bg); }

    .fund-input {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text);
      font-family: Georgia, serif;
      font-size: 0.88rem;
      text-align: center;
      width: 5rem;
      padding: 0.22rem 0.4rem;
      -moz-appearance: textfield;
    }
    .fund-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .fund-input:focus { outline: none; border-color: var(--accent); }

    .oct-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--control);
      font-family: Georgia, serif;
      font-size: 0.6rem;
      padding: 0.22rem 0.48rem;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: color 0.1s, border-color 0.1s;
    }
    .oct-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.18); }

    /* ── Description bar ──────────────────────────────── */
    #desc { font-size: 0.58rem; letter-spacing: 0.1em; color: var(--dim); font-style: italic; }

    /* ── Keyboard ─────────────────────────────────────── */
    .kbd-wrap {
      width: 100%;
      max-width: 980px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    #keyboard {
      display: flex;
      gap: 3px;
      width: max-content;
      margin: 0 auto;
    }

    .key {
      width: 52px;        /* overridden by JS for each tuning */
      height: 130px;
      flex-shrink: 0;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 0.45rem 0.1rem 0.38rem;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.06s, border-color 0.06s;
    }
    .key:hover { background: rgba(255,255,255,0.07); }
    .key:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
    .key.active {
      background: var(--accent-bg);
      border-color: var(--accent);
    }
    .key.active .key-label { color: var(--accent); }

    .key-cents {
      font-size: 0.5rem;
      font-style: italic;
      letter-spacing: 0.03em;
      min-height: 0.75rem;
      text-align: center;
    }

    .key-label {
      font-size: 0.78rem;
      color: var(--text);
      text-align: center;
      line-height: 1.2;
      letter-spacing: 0.02em;
    }

    .key-shortcut {
      font-size: 0.48rem;
      color: var(--dim);
      letter-spacing: 0.1em;
      font-style: italic;
    }

    /* ── Scope ────────────────────────────────────────── */
    .scope-wrap { width: 100%; max-width: 980px; }

    canvas {
      display: block;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 2px;
    }

    .eggs-back {
      position: fixed; top: .7rem; left: 1rem;
      font-size: .58rem; color: var(--control); text-decoration: none;
      letter-spacing: .08em; font-family: 'SF Mono','Fira Code',monospace;
      z-index: 100; transition: color .15s;
    }
    .eggs-back:hover { color: #aaa; }

    /* ── Hint ─────────────────────────────────────────── */
    .hint {
      font-size: 0.54rem;
      letter-spacing: 0.12em;
      color: var(--dim);
      font-style: italic;
      text-align: center;
    }

    @media (max-width: 480px) {
      .controls { gap: 0.7rem 1rem; }
    }
  </style>
</head>
<body>

<a class="eggs-back" href="../eggs.html">← eggs</a>

<div class="header">
  <h1 class="title">tuning systems</h1>
  <p class="sub">click keys or use keyboard · hold multiple keys for polyphony</p>
</div>

<!-- Controls -->
<div class="controls">

  <div class="ctrl-group">
    <span class="ctrl-label">tuning</span>
    <div class="btn-row" id="tuning-btns">
      <button class="tog on" data-t="12">12-TET</button>
      <button class="tog" data-t="19">19-TET</button>
      <button class="tog" data-t="31">31-TET</button>
      <button class="tog" data-t="ji">just</button>
      <button class="tog" data-t="harm">harmonic</button>
    </div>
  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">fundamental</span>
    <button class="oct-btn" id="oct-dn">&minus;8va</button>
    <input type="number" id="fund-input" class="fund-input" value="110" min="10" max="4000" step="0.01">
    <span class="ctrl-label">Hz</span>
    <button class="oct-btn" id="oct-up">+8va</button>
  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">wave</span>
    <div class="btn-row" id="wave-btns">
      <button class="tog on" data-w="sine">sine</button>
      <button class="tog" data-w="sawtooth">saw</button>
      <button class="tog" data-w="triangle">tri</button>
    </div>
  </div>

  <div class="ctrl-group">
    <button class="oct-btn" id="triad-btn" title="hold the major triad; it re-voices when you switch tuning">major triad</button>
    <button class="oct-btn" id="silence-btn">silence</button>
  </div>

</div>

<p id="desc"></p>

<!-- Keyboard -->
<div class="kbd-wrap">
  <div id="keyboard" role="group" aria-label="Microtonal keyboard"></div>
</div>

<!-- Oscilloscope -->
<div class="scope-wrap">
  <canvas id="scope" height="60" aria-hidden="true"></canvas>
</div>

<p class="hint">← → shift octave &nbsp;·&nbsp; esc silence all &nbsp;·&nbsp; qwerty rows map low → high</p>

<script>
// ── Key sequence: 30 keys, lowest to highest pitch ──────────────────────
// Row order: z-row → a-row → q-row
// Physical rows bottom→top, left→right: z-row / a-row / q-row / number row
// z–p = exactly 31 keys (perfect for 31-TET); []\`1234567890-= extend further
const KEY_SEQ = [
  'z','x','c','v','b','n','m',',','.','/','a','s','d','f','g','h','j','k','l',";","'",
  'q','w','e','r','t','y','u','i','o','p','[',']','\\',
  '`','1','2','3','4','5','6','7','8','9','0','-','='
];

// Same sequence as physical key codes. Note-on/note-off match on e.code, never
// on e.key: pressing shift or capslock mid-note rewrites e.key and the keyup
// would never match its keydown, leaving the note sounding forever.
const CODE_SEQ = [
  'KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM','Comma','Period','Slash',
  'KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon','Quote',
  'KeyQ','KeyW','KeyE','KeyR','KeyT','KeyY','KeyU','KeyI','KeyO','KeyP',
  'BracketLeft','BracketRight','Backslash',
  'Backquote','Digit1','Digit2','Digit3','Digit4','Digit5','Digit6','Digit7',
  'Digit8','Digit9','Digit0','Minus','Equal'
];

// ── Tuning utilities ────────────────────────────────────────────────────

// Cents deviation of a ratio from its nearest 12-TET semitone
function centsFromRatio(ratio) {
  const semis   = 12 * Math.log2(ratio);
  const nearest = Math.round(semis);
  return Math.round((semis - nearest) * 100);
}

function fmtCents(c) {
  if (c === 0) return '';
  return (c > 0 ? '+' : '') + c + '\u00a2';
}

// Color encodes deviation magnitude: green (pure) → amber → red (far)
function centsColor(c) {
  const a = Math.abs(c);
  if (a === 0)  return 'transparent';
  if (a <= 5)   return 'rgba(138,210,160,0.85)';
  if (a <= 15)  return 'rgba(200,200,120,0.85)';
  if (a <= 30)  return 'rgba(210,160, 90,0.85)';
  return             'rgba(210,100, 90,0.85)';
}

// ── Tuning system definitions ───────────────────────────────────────────

// 12-TET names follow the fundamental: step 0 is named for the nearest
// 12-TET pitch to it (A at the default 110 Hz, C at 261.63)
const C_NAMES = ['C','C\u266f','D','D\u266f','E','F','F\u266f','G','G\u266f','A','A\u266f','B'];
function fundamentalPc() {
  return ((Math.round(12 * Math.log2(fundamental / 440)) + 9) % 12 + 12) % 12;
}

// 19- and 31-TET spelled along the chain of fifths: the fifth is 11 of 19
// (18 of 31) steps, so each chain position k (C = 0) lands on one step. The
// spelling window is fixed on the chain, whatever the fundamental: 19 uses
// k = −6…12 (C C♯ D♭ D D♯ E♭ E E♯ F F♯ G♭ G G♯ A♭ A A♯ B♭ B B♯), 31 uses
// k = −15…15 (meantone spelling, doubles for the outer steps).
const PC_TO_LOF = { 0: 0, 7: 1, 2: 2, 9: 3, 4: 4, 11: 5, 6: 6, 1: 7, 8: -4, 3: -3, 10: -2, 5: -1 };
function lofName(k) {
  const letter = 'FCGDAEB'[((k + 1) % 7 + 7) % 7];
  const acc = Math.floor((k + 1) / 7);
  return letter + (acc === 2 ? '\u{1D12A}' : acc === -2 ? '\u{1D12B}' : acc > 0 ? '\u266f'.repeat(acc) : '\u266d'.repeat(-acc));
}
function edoNames(edo, fifthSteps, kLo, kHi) {
  const root = PC_TO_LOF[fundamentalPc()];
  const names = new Array(edo);
  for (let k = kLo; k <= kHi; k++) names[(((k - root) * fifthSteps) % edo + edo) % edo] = lofName(k);
  return names;
}

// 5-limit chromatic just intonation (12 pitches, starting on A)
const JI_RATIOS = [1, 16/15, 9/8, 6/5, 5/4, 4/3, 45/32, 3/2, 8/5, 5/3, 9/5, 15/8];
const JI_NAMES  = ['1/1','16/15','9/8','6/5','5/4','4/3','45/32','3/2','8/5','5/3','9/5','15/8'];

const TUNINGS = {
  '12': {
    label: '12-TET',
    desc:  '12 equal divisions of the octave \u00b7 100\u00a2 per step',
    steps: 12,
    freq:  (f, n) => f * Math.pow(2, n / 12),
    name:  n => C_NAMES[(fundamentalPc() + n) % 12],
    cents: n => 0,
  },
  '19': {
    label: '19-TET',
    desc:  '19 equal divisions \u00b7 \u224863\u00a2 per step \u00b7 enharmonic equivalents are distinct pitches',
    steps: 19,
    freq:  (f, n) => f * Math.pow(2, n / 19),
    name:  n => edoNames(19, 11, -6, 12)[n % 19],
    cents: n => centsFromRatio(Math.pow(2, n / 19)),
  },
  '31': {
    label: '31-TET',
    desc:  '31 equal divisions \u00b7 \u224839\u00a2 per step \u00b7 close to quarter-comma meantone',
    steps: 31,
    freq:  (f, n) => f * Math.pow(2, n / 31),
    name:  n => edoNames(31, 18, -15, 15)[n % 31],
    cents: n => centsFromRatio(Math.pow(2, n / 31)),
  },
  'ji': {
    label: 'just intonation',
    desc:  '5-limit chromatic \u00b7 pure ratios \u00b7 cents show deviation from 12-TET',
    steps: 12,
    freq:  (f, n) => f * JI_RATIOS[n % 12],
    name:  n => JI_NAMES[n % 12],
    cents: n => centsFromRatio(JI_RATIOS[n % 12]),
  },
  'harm': {
    label: 'harmonic series',
    desc:  'partials 1\u201316 above fundamental \u00b7 natural overtone sequence',
    steps: 16,
    freq:  (f, n) => f * (n + 1),
    name:  n => String(n + 1),
    cents: n => centsFromRatio(n + 1),
  },
};

// ── State ────────────────────────────────────────────────────────────────
let tuningKey  = '12';
let triadOn    = false;   // the held major triad (see below)
let fundamental = 110;
let waveform   = 'sine';

// ── Audio engine ─────────────────────────────────────────────────────────
let ac = null, masterGain, compressor, analyser, scopeBuf;
let rafId = null;
const voices = {};    // voiceId → { osc, gain, release }
const heldKeys = new Set();

function initAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = ac.createGain();
  masterGain.gain.value = 0.85;
  // Compressor prevents clipping with many simultaneous voices
  compressor = ac.createDynamicsCompressor();
  compressor.threshold.value = -14;
  compressor.knee.value      =   6;
  compressor.ratio.value     =   4;
  compressor.attack.value    = 0.004;
  compressor.release.value   = 0.12;
  analyser = ac.createAnalyser();
  analyser.fftSize = 1024;
  analyser.smoothingTimeConstant = 0.65;
  scopeBuf = new Uint8Array(analyser.fftSize);
  masterGain.connect(compressor);
  compressor.connect(analyser);
  analyser.connect(ac.destination);
}

function startVoice(vid, freq) {
  const prev = voices[vid];
  if (prev) {
    // Still sounding and not released — nothing to retrigger
    if (!prev.release) return;
    // Retrigger inside the 350 ms release window: cancel the pending cleanup
    // and free the fading oscillator, or its timeout deletes the new voice
    clearTimeout(prev.release);
    try { prev.osc.stop(); } catch (_) {}
    delete voices[vid];
  }
  initAudio();
  if (ac.state === 'suspended') ac.resume();
  const osc  = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = waveform;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, ac.currentTime);
  gain.gain.setTargetAtTime(0.12, ac.currentTime, 0.012);
  osc.connect(gain);
  gain.connect(masterGain);
  osc.start();
  voices[vid] = { osc, gain, release: null };
  if (!rafId) startScope();
}

function stopVoice(vid) {
  const v = voices[vid];
  if (!v || v.release) return;
  const { osc, gain } = v;
  gain.gain.setTargetAtTime(0, ac.currentTime, 0.05);
  v.release = setTimeout(() => {
    try { osc.stop(); } catch (_) {}
    // Only clear the slot if this voice is still the one living in it
    if (voices[vid] === v) delete voices[vid];
    checkScope();
  }, 350);
}

// True while a voice is sounding and has not been released
function isSounding(vid) {
  const v = voices[vid];
  return !!v && !v.release;
}

// Panic button. Empties the voice table synchronously so nothing can survive
// a stuck keyup, an interrupted touch, or a tab switch.
function stopAll() {
  Object.keys(voices).forEach(vid => {
    const v = voices[vid];
    if (v.release) clearTimeout(v.release);
    try { v.gain.gain.cancelScheduledValues(ac.currentTime); } catch (_) {}
    try { v.gain.gain.setTargetAtTime(0, ac.currentTime, 0.02); } catch (_) {}
    try { v.osc.stop(ac.currentTime + 0.12); } catch (_) {}
    delete voices[vid];
  });
  heldKeys.clear();
  document.querySelectorAll('.key.active').forEach(k => k.classList.remove('active'));
  triadOn = false;
  const tb = document.getElementById('triad-btn');
  if (tb) tb.classList.remove('on');
  checkScope();
}

// ── Keyboard DOM ──────────────────────────────────────────────────────────
// Does NOT silence anything — held notes carry across a rebuild. Callers that
// invalidate the pitches (a tuning change) call stopAll() themselves.
function buildKeyboard() {
  const kbd   = document.getElementById('keyboard');
  const t     = TUNINGS[tuningKey];
  kbd.innerHTML = '';

  // Compute key width to fill the container when possible. On a phone the
  // keys wrap into balanced rows instead of scrolling: a swipe on a key plays
  // it, so a keyboard wider than the screen left keys out of reach.
  const containerW = Math.min(window.innerWidth - 48, 980);
  const phone      = window.innerWidth < 600;
  const gap        = phone ? 2 : 3;
  const longest    = Math.max(...Array.from({ length: t.steps }, (_, i) => t.name(i).length));
  const minW       = phone ? (longest > 3 ? 34 : 26) : 36;
  let perRow = t.steps, rows = 1;
  if (phone) {
    const fit = Math.max(1, Math.floor((containerW + gap) / (minW + gap)));
    rows   = Math.ceil(t.steps / fit);
    perRow = Math.ceil(t.steps / rows);
  }
  const keyW = Math.max(minW, Math.floor((containerW - (perRow - 1) * gap) / perRow));
  kbd.style.gap      = gap + 'px';
  kbd.style.flexWrap = phone ? 'wrap' : '';
  kbd.style.width    = phone ? (perRow * keyW + (perRow - 1) * gap) + 'px' : '';

  for (let i = 0; i < t.steps; i++) {
    const kc = KEY_SEQ[i]  || '';
    const cd = CODE_SEQ[i] || '';
    const c  = t.cents(i);

    const el = document.createElement('div');
    el.className = 'key';
    el.style.width = keyW + 'px';
    if (rows > 1) el.style.height = '84px';
    el.dataset.step    = i;
    el.dataset.keychar = kc;
    el.dataset.keycode = cd;
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.setAttribute('aria-label', `${t.name(i)}, step ${i}`);

    el.innerHTML =
      `<span class="key-cents" style="color:${centsColor(c)}">${fmtCents(c)}</span>` +
      `<span class="key-label">${t.name(i)}</span>` +
      `<span class="key-shortcut">${kc}</span>`;

    // Pointer events
    el.addEventListener('mousedown',  e => { e.preventDefault(); pressKey(i, 'm' + i); el.classList.add('active'); });
    el.addEventListener('mouseup',    ()  => { releaseKey('m' + i); el.classList.remove('active'); });
    el.addEventListener('mouseleave', ()  => { releaseKey('m' + i); el.classList.remove('active'); });
    el.addEventListener('touchstart', e => { e.preventDefault(); pressKey(i, 'm' + i); el.classList.add('active'); }, { passive: false });
    el.addEventListener('touchend',   e => { e.preventDefault(); releaseKey('m' + i); el.classList.remove('active'); }, { passive: false });
    // An interrupted touch (incoming call, notification swipe) never sends touchend
    el.addEventListener('touchcancel',   () => { releaseKey('m' + i); el.classList.remove('active'); });
    el.addEventListener('pointercancel', () => { releaseKey('m' + i); el.classList.remove('active'); });

    // role="button" + tabindex 0 has to mean something: enter and space play
    el.addEventListener('keydown', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      if (e.repeat) return;
      pressKey(i, 'b' + i);
      el.classList.add('active');
    });
    el.addEventListener('keyup', e => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      releaseKey('b' + i);
      el.classList.remove('active');
    });
    // Tabbing away mid-note swallows the keyup
    el.addEventListener('blur', () => { releaseKey('b' + i); el.classList.remove('active'); });

    // Carry held notes across a rebuild: re-light whatever is still sounding
    if (isSounding('m' + i) || isSounding('b' + i) || (cd && heldKeys.has('k' + cd))) {
      el.classList.add('active');
    }

    kbd.appendChild(el);
  }

  document.getElementById('desc').textContent = t.desc;
}

function pressKey(stepIndex, vid) {
  const freq = TUNINGS[tuningKey].freq(fundamental, stepIndex);
  startVoice(vid, freq);
}

function releaseKey(vid) {
  stopVoice(vid);
}

// ── Keyboard input ─────────────────────────────────────────────────────
function isTyping(e) {
  const tag = e.target && e.target.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA';
}

document.addEventListener('keydown', e => {
  if (e.repeat || isTyping(e)) return;

  if (e.code === 'ArrowLeft')  { e.preventDefault(); shiftOctave(-1); return; }
  if (e.code === 'ArrowRight') { e.preventDefault(); shiftOctave(1);  return; }
  if (e.code === 'Escape')     { e.preventDefault(); stopAll();        return; }

  const si = CODE_SEQ.indexOf(e.code);
  if (si === -1 || si >= TUNINGS[tuningKey].steps) return;
  e.preventDefault();

  const vid = 'k' + e.code;
  if (heldKeys.has(vid)) return;
  heldKeys.add(vid);

  pressKey(si, vid);
  const el = document.querySelector(`[data-keycode="${e.code}"]`);
  if (el) el.classList.add('active');
});

document.addEventListener('keyup', e => {
  const vid = 'k' + e.code;
  if (!heldKeys.has(vid)) return;
  heldKeys.delete(vid);
  releaseKey(vid);
  const el = document.querySelector(`[data-keycode="${e.code}"]`);
  if (el) el.classList.remove('active');
});

// A window switch or app swipe swallows every keyup — drop the lot
window.addEventListener('blur', stopAll);

// ── Tuning buttons ─────────────────────────────────────────────────────
document.getElementById('tuning-btns').addEventListener('click', e => {
  const btn = e.target.closest('.tog');
  if (!btn) return;
  document.querySelectorAll('#tuning-btns .tog').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  tuningKey = btn.dataset.t;
  const keepTriad = triadOn;
  stopAll();          // the old pitches no longer exist in the new tuning
  buildKeyboard();
  if (keepTriad) { triadOn = true; voiceTriad(); syncTriadBtn(); }   // the held triad re-voices in the new system
});

// ── Waveform buttons ──────────────────────────────────────────────────
document.getElementById('wave-btns').addEventListener('click', e => {
  const btn = e.target.closest('.tog');
  if (!btn) return;
  document.querySelectorAll('#wave-btns .tog').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  waveform = btn.dataset.w;
  Object.values(voices).forEach(v => { v.osc.type = waveform; });
});

// ── Fundamental ────────────────────────────────────────────────────────
const fundEl = document.getElementById('fund-input');
fundEl.addEventListener('input', () => {
  const v = parseFloat(fundEl.value);
  if (isFinite(v) && v > 10) { fundamental = v; stopAll(); buildKeyboard(); }
});

function shiftOctave(dir) {
  fundamental = Math.round(fundamental * Math.pow(2, dir) * 100) / 100;
  fundEl.value = fundamental;
  stopAll();
}

document.getElementById('silence-btn').addEventListener('click', stopAll);

// ── The same chord in each system ─────────────────────────────────────────
// A held major triad that survives a tuning change, so the systems can be
// A/B'd: 12-TET 0-4-7, 19-TET 0-6-11, 31-TET 0-10-18, just 1 5/4 3/2,
// harmonic partials 4-5-6.
const TRIAD_STEPS = { '12': [0, 4, 7], '19': [0, 6, 11], '31': [0, 10, 18], 'ji': [0, 4, 7], 'harm': [3, 4, 5] };
function syncTriadBtn() {
  document.getElementById('triad-btn').classList.toggle('on', triadOn);
}
function voiceTriad() {
  TRIAD_STEPS[tuningKey].forEach((st, i) => {
    pressKey(st, 't' + i);
    const el = document.querySelector(`.key[data-step="${st}"]`);
    if (el) el.classList.add('active');
  });
}
document.getElementById('triad-btn').addEventListener('click', () => {
  if (triadOn) {
    triadOn = false;
    [0, 1, 2].forEach(i => releaseKey('t' + i));
    document.querySelectorAll('.key.active').forEach(k => k.classList.remove('active'));
  } else {
    triadOn = true;
    voiceTriad();
  }
  syncTriadBtn();
});

document.getElementById('oct-dn').addEventListener('click', () => shiftOctave(-1));
document.getElementById('oct-up').addEventListener('click', () => shiftOctave(1));

// ── Oscilloscope ──────────────────────────────────────────────────────
function startScope() {
  if (rafId) return;
  drawScope();
}

function checkScope() {
  if (Object.keys(voices).length === 0 && rafId) {
    cancelAnimationFrame(rafId);
    rafId = null;
    blankScope();
  }
}

function blankScope() {
  const cv = document.getElementById('scope');
  // size the idle canvas the way drawScope does (60 px tall), so the box
  // doesn't open at the 300×60 intrinsic ratio and snap on the first note
  cv.width  = (cv.offsetWidth || 300) * (devicePixelRatio || 1);
  cv.height = 60 * (devicePixelRatio || 1);
  const g  = cv.getContext('2d');
  g.fillStyle = '#0a0a0a';
  g.fillRect(0, 0, cv.width, cv.height);
}

function drawScope() {
  rafId = requestAnimationFrame(drawScope);
  const cv = document.getElementById('scope');
  const W  = cv.width  = cv.offsetWidth * devicePixelRatio;
  const H  = cv.height = 60 * devicePixelRatio;
  const g  = cv.getContext('2d');
  g.scale(devicePixelRatio, devicePixelRatio);
  const w = W / devicePixelRatio, h = H / devicePixelRatio;

  g.fillStyle = '#0a0a0a';
  g.fillRect(0, 0, w, h);

  if (!analyser) return;
  analyser.getByteTimeDomainData(scopeBuf);
  g.strokeStyle = 'rgba(138,176,200,0.7)';
  g.lineWidth   = 1;
  g.beginPath();
  const sw = w / scopeBuf.length;
  for (let i = 0; i < scopeBuf.length; i++) {
    const y = h / 2 + (scopeBuf[i] / 128 - 1) * h * 0.42;
    i === 0 ? g.moveTo(0, y) : g.lineTo(i * sw, y);
  }
  g.stroke();
}

// Rebuild on resize (debounced), but only on a real width change. A phone's
// URL bar collapsing fires resize at the same width, and rebuilding there
// used to pull the keyboard out from under every held note.
let resizeTimer;
let lastWidth = window.innerWidth;
window.addEventListener('resize', () => {
  if (window.innerWidth === lastWidth) return;
  lastWidth = window.innerWidth;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(buildKeyboard, 200);
});

// ── Init ──────────────────────────────────────────────────────────────
buildKeyboard();
blankScope();
</script>
</body>
</html>
