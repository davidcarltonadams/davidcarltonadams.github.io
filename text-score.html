<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="thirty one-line text scores, drawn one at a time — prose instructions for listening, tuning and silence that you perform yourself.">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <title>a score</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #060606;
      color: #d4ccC4;
      font-family: Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Back to the nest ───────────────────────────────────── */
    .eggs-back {
      position: fixed; top: .7rem; left: 1rem;
      font-size: .58rem; color: #332; text-decoration: none;
      letter-spacing: .08em; font-family: 'SF Mono','Fira Code',monospace;
      z-index: 100; transition: color .15s;
    }
    .eggs-back:hover { color: #aaa; }

    /* ── Score text ─────────────────────────────────────────── */
    #score-text {
      max-width: min(640px, 88vw);
      text-align: center;
      padding: 2rem;
      transition: opacity 0.5s ease;
      /* it is a text score: people need to quote it */
      user-select: text;
      -webkit-user-select: text;
      cursor: text;
    }

    .instruction {
      font-size: clamp(1.1rem, 3.5vw, 1.7rem);
      font-weight: normal;
      line-height: 1.55;
      letter-spacing: 0.02em;
      color: #d4ccc4;
    }

    .instruction em {
      font-style: italic;
      color: rgba(212,204,196,0.7);
    }

    /* ── Footer: score id + category ───────────────────────── */
    #score-meta {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      color: rgba(212,204,196,0.45);
      font-style: italic;
      white-space: nowrap;
      text-align: center;
      transition: opacity 0.5s ease;
    }

    /* ── Controls: prev, random, auto ───────────────────────── */
    #prev-btn, #random-btn, #auto-btn {
      position: fixed;
      bottom: 1.6rem;
      font-size: 1rem;
      color: rgba(212,204,196,0.38);
      background: none;
      border: none;
      cursor: pointer;
      font-family: Georgia, serif;
      padding: 0.4rem 0.6rem;
      transition: color 0.3s ease;
      line-height: 1;
    }

    #prev-btn   { right: 4.2rem; }
    #random-btn { right: 2rem; }

    #auto-btn {
      left: 2rem;
      font-size: 0.55rem;
      font-style: italic;
      letter-spacing: 0.2em;
    }

    #prev-btn:hover, #random-btn:hover, #auto-btn:hover { color: rgba(212,204,196,0.65); }

    #prev-btn[disabled] { opacity: 0.3; cursor: default; }
    #auto-btn[aria-pressed="true"] { color: rgba(212,204,196,0.72); }

    /* ── Fade state ─────────────────────────────────────────── */
    .fade-out { opacity: 0; }
  </style>
</head>
<body>

<a class="eggs-back" href="eggs.html">← eggs</a>

<div id="score-text" aria-live="polite">
  <p class="instruction" id="instruction-el"></p>
</div>

<p id="score-meta"></p>
<button id="prev-btn" title="previous score" aria-label="previous score">‹</button>
<button id="random-btn" title="random score" aria-label="load random score">↻</button>
<button id="auto-btn" title="advance on its own every 5 minutes" aria-label="auto-advance" aria-pressed="false">auto</button>

<script src="js/scores-data.js"></script>
<script>
const textEl  = document.getElementById('score-text');
const instrEl = document.getElementById('instruction-el');
const metaEl  = document.getElementById('score-meta');
const btn     = document.getElementById('random-btn');
const prevBtn = document.getElementById('prev-btn');
const autoBtn = document.getElementById('auto-btn');

const AUTO_MS = 5 * 60 * 1000; // 5 minutes
let autoTimer = null;
let autoOn    = false; // opt-in: nothing moves unless you ask it to
let current   = 0;
let depth     = 0;     // how many entries we have pushed onto history

function pad(n) { return String(n).padStart(2, '0'); }

function formatText(raw) { return raw.split('\n').join('<br>'); }

// nav: 'push' for a move the reader made (Back steps through them),
//      'replace' for the unattended timer, 'none' when history moved us.
function show(idx, animate, nav) {
  const s = SCORES[idx];
  const render = () => {
    instrEl.innerHTML = formatText(s.text);
    metaEl.textContent = pad(s.id) + ' of ' + SCORES.length + ' — ' + s.category;
    const url = '?n=' + pad(s.id);
    if (nav === 'push') {
      history.pushState({ depth: ++depth }, '', url);
    } else if (nav === 'replace') {
      history.replaceState({ depth: depth }, '', url);
    }
    syncPrev();
    textEl.classList.remove('fade-out');
  };
  if (animate) {
    textEl.classList.add('fade-out');
    setTimeout(render, 500);
  } else {
    render();
  }
}

function syncPrev() { prevBtn.disabled = depth === 0; }

function randomIndex(avoid) {
  if (SCORES.length === 1) return 0;
  let n;
  do { n = Math.floor(Math.random() * SCORES.length); } while (n === avoid);
  return n;
}

function loadRandom(nav) {
  current = randomIndex(current);
  show(current, true, nav);
  resetTimer();
}

function goPrev() {
  if (depth > 0) history.back();
}

function resetTimer() {
  clearTimeout(autoTimer);
  if (autoOn) autoTimer = setTimeout(() => loadRandom('replace'), AUTO_MS);
}

function setAuto(on) {
  autoOn = on;
  autoBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  autoBtn.textContent = on ? 'auto on' : 'auto';
  resetTimer();
}

// Click anywhere (except the controls) or press space/enter/right = random.
// A click that ends a selection is someone copying the score, not advancing.
document.addEventListener('click', e => {
  if (e.target.closest && e.target.closest('button')) return;
  const sel = window.getSelection && window.getSelection();
  if (sel && String(sel).length) return;
  loadRandom('push');
});
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Enter') {
    e.preventDefault();
    loadRandom('push');
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    goPrev();
  }
});
btn.addEventListener('click', e => {
  e.stopPropagation();
  loadRandom('push');
});
prevBtn.addEventListener('click', e => {
  e.stopPropagation();
  goPrev();
});
autoBtn.addEventListener('click', e => {
  e.stopPropagation();
  setAuto(!autoOn);
});

// Back/forward: the URL is the score, so render whatever it now says
window.addEventListener('popstate', e => {
  depth = (e.state && e.state.depth) || 0;
  const id    = parseInt(new URLSearchParams(window.location.search).get('n'), 10);
  const found = SCORES.findIndex(s => s.id === id);
  if (found >= 0) {
    current = found;
    show(current, true, 'none');
  }
  syncPrev();
  resetTimer();
});

// Init: honour ?n= param or pick random
const params = new URLSearchParams(window.location.search);
const nParam = params.get('n');
if (nParam) {
  const id    = parseInt(nParam, 10);
  const found = SCORES.findIndex(s => s.id === id);
  current = found >= 0 ? found : randomIndex(-1);
} else {
  current = randomIndex(-1);
}
show(current, false, 'replace');
setAuto(false);
</script>

</body>
</html>
