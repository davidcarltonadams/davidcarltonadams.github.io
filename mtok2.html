<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- user-scalable=no is ignored by iOS Safari since iOS 10; the real guards
     are the gesturestart / double-tap preventDefault handlers at the bottom. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a10">
<title>MTOK 2b — microtonal control surface</title>
<style>
:root{
  --bg:#0a0a10; --panel:#14141e; --line:#2a2a3a;
  --txt:#d8d8e8; --dim:#7a7a95; --acc:#4a9eff;
}
*{margin:0;padding:0;box-sizing:border-box;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font:12px/1.2 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  overscroll-behavior:none;}

/* ── page frame: topbar + letterboxed stage + margin strips ── */
#app{display:grid;grid-template-rows:24px 1fr;height:100%;gap:4px;padding:4px;}
#topbar{display:flex;align-items:center;gap:10px;padding:0 4px;font-size:11px;}
#topbar .name{color:var(--acc);font-weight:600;letter-spacing:.06em;}
#topbar .sp{flex:1;}
.badge{padding:1px 7px;border:1px solid var(--line);border-radius:3px;color:var(--dim);}
.badge[data-state="running"]{color:#5ab06a;border-color:#2d5a35;}
.badge[data-state="suspended"]{color:#d88a3a;border-color:#5a4020;}
.badge.warn{color:#d88a3a;border-color:#5a4020;}

#stage-wrap{position:relative;display:flex;align-items:center;justify-content:center;
  min-height:0;}
#stage{position:relative;background:#000;}
#kb-canvas{position:absolute;inset:0;display:block;touch-action:none;z-index:0;}
#controls{position:absolute;inset:0;z-index:1;pointer-events:none;}
/* wrappers are full-frame and often larger than the widget they center —
   they must pass pointers through; only the widget itself catches them */
.abs{position:absolute;display:flex;align-items:center;justify-content:center;
  min-width:0;min-height:0;pointer-events:none;}
.abs > *{max-width:100%;max-height:100%;pointer-events:auto;}

/* .tosc labels: colored text, click-through so they never block a key */
.lab{pointer-events:none !important;width:100%;height:100%;display:flex;
  align-items:center;justify-content:center;text-align:center;
  white-space:pre-line;line-height:1.05;text-shadow:0 1px 2px #000;}
.abs:has(> .lab){pointer-events:none;}

/* aux margin strips — post-TouchOSC params, awaiting real placement */
.aux{position:absolute;top:0;bottom:0;width:54px;display:flex;
  flex-direction:column;gap:4px;align-items:center;overflow:hidden;
  padding:2px 1px;}
#aux-left{left:0;} #aux-right{right:0;}
.aux-item{display:flex;flex-direction:column;align-items:center;gap:1px;width:100%;}
.aux-l{font-size:7px;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;}
.aux-col{display:flex;flex-direction:column;gap:2px;width:100%;align-items:center;}
.aux .tog,.aux .btn{min-width:30px;min-height:22px;width:90%;font-size:9px;}
.aux .radio{width:90%;}
.aux .radio-btn{min-width:0;min-height:18px;font-size:8px;padding:1px;}

/* ── dial ───────────────────────────────────────────────── */
.dial{position:relative;width:var(--dsz);height:var(--dsz);flex:0 0 auto;
  touch-action:none;display:flex;align-items:center;justify-content:center;}
.dial-face{width:100%;height:100%;overflow:visible;}
.dial-track{fill:none;stroke:#20202e;stroke-width:9;stroke-linecap:round;}
.dial-fill{fill:none;stroke:var(--dc);stroke-width:9;stroke-linecap:round;opacity:.85;}
.dial-needle{stroke:var(--dc);stroke-width:5;stroke-linecap:round;}
.dial-label{position:absolute;bottom:-1px;left:0;right:0;text-align:center;
  font-size:8px;color:var(--dim);pointer-events:none;}
.dial-read{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:9px;color:var(--txt);opacity:0;pointer-events:none;
  background:rgba(0,0,0,.75);padding:1px 3px;border-radius:2px;}
.dial.live .dial-read{opacity:1;}
.dial.live .dial-fill{opacity:1;}

/* ── fader ──────────────────────────────────────────────── */
.fader{position:relative;width:100%;height:100%;
  background:#1c1c28;border:1px solid var(--line);border-radius:3px;
  overflow:hidden;touch-action:none;}
.fader-fill{position:absolute;left:0;bottom:0;top:0;width:0;background:var(--dc);opacity:.5;}
.fader.vert .fader-fill{top:auto;width:100%;height:0;}
.fader-label{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;font-size:9px;color:var(--txt);pointer-events:none;
  text-shadow:0 1px 2px #000;}
.fader.vert .fader-label{writing-mode:vertical-rl;}
.fader-read{position:absolute;right:3px;top:50%;transform:translateY(-50%);
  font-size:8px;color:var(--txt);opacity:0;pointer-events:none;text-shadow:0 1px 2px #000;}
.fader.vert .fader-read{right:auto;left:50%;top:4px;transform:translateX(-50%);}
.fader.live .fader-read{opacity:.9;}
.fader.live .fader-fill{opacity:.75;}

/* ── radio / toggle / button ────────────────────────────── */
.radio{width:100%;height:100%;display:flex;flex-direction:column;gap:1px;}
.radio-label{font-size:8px;color:var(--dim);}
.radio-row{display:flex;gap:1px;flex:1 1 auto;min-height:0;}
.radio.vert .radio-row{flex-direction:column;}
.radio-btn,.tog,.btn{
  flex:1 1 auto;min-width:0;min-height:0;padding:1px 2px;
  background:#1c1c28;border:1px solid var(--line);border-radius:3px;
  color:var(--dim);font:inherit;font-size:9px;line-height:1.05;
  touch-action:manipulation;display:inline-flex;align-items:center;
  justify-content:center;gap:1px;}
.radio-btn.on,.tog.on{background:color-mix(in srgb,var(--dc) 30%,#1c1c28);
  border-color:var(--dc);color:#fff;}
.radio-btn .badge{border:0;padding:0;color:var(--dc);font-size:7px;}
.radio-btn.filled{border-color:var(--dc);color:var(--txt);}
.abs .tog,.abs .btn{width:100%;height:100%;}
.tog.dead{opacity:.4;border-style:dashed;}
.tog.dead.nope{animation:shake .26s;}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.btn.scram{background:#3a1010;border-color:#7a2020;color:#e08080;
  writing-mode:vertical-rl;font-weight:600;letter-spacing:.22em;}

/* ── XY pads ────────────────────────────────────────────── */
.xy{position:relative;width:100%;height:100%;min-height:0;
  background:#0d1408;border:1px solid var(--dc);border-radius:4px;
  touch-action:none;overflow:hidden;}
.xy-canvas{display:block;width:100%;height:100%;}
.xy-label{position:absolute;left:4px;top:3px;font-size:9px;color:var(--dc);
  opacity:.65;pointer-events:none;}

/* ── unlock overlay ─────────────────────────────────────── */
#unlock{position:fixed;inset:0;z-index:50;background:rgba(6,6,12,.94);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;text-align:center;touch-action:manipulation;}
#unlock.gone{display:none;}
.unlock-main{font-size:22px;color:var(--acc);letter-spacing:.1em;}
.unlock-sub{font-size:12px;color:var(--dim);max-width:60%;}
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <span class="name">MTOK 2b</span>
    <span class="badge" id="ctx-badge" data-state="null">ctx:null</span>
    <span class="badge" id="voice-count">0 v</span>
    <span class="badge" id="audit-badge">—</span>
    <span class="sp"></span>
  </div>

  <div id="stage-wrap">
    <div class="aux" id="aux-left"></div>
    <div id="stage">
      <canvas id="kb-canvas"></canvas>
      <div id="controls"></div>
    </div>
    <div class="aux" id="aux-right"></div>
  </div>
</div>

<div id="unlock">
  <div class="unlock-main">touch to start</div>
  <div class="unlock-sub">iOS requires a gesture before audio. Escape or SCRAM silences everything.</div>
</div>

<script>
// ── iOS gesture guards (wave-1 field report, 2026-08-15) ──────────────
['gesturestart','gesturechange','gestureend'].forEach(t =>
  document.addEventListener(t, e => e.preventDefault(), {passive:false}));
let _lastTap = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - _lastTap < 320) e.preventDefault();   // double-tap zoom
  _lastTap = now;
}, {passive:false});
document.addEventListener('dblclick', e => e.preventDefault(), {passive:false});
// v2b: nothing on the page scrolls — refuse page-level touchmove everywhere.
// (Widget + keyboard drags run on pointer events / their own touch handlers.)
document.addEventListener('touchmove', e => e.preventDefault(), {passive:false});
</script>
<script type="module" src="./js/mtok/ui.js?v=7"></script>
</body>
</html>
